<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeSync — Live Collaborative Code Editor</title>

  <!-- Tailwind CSS via CDN (fine for development; we can build a proper CLI setup later if needed) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Our own stylesheet, for anything Tailwind can't easily do -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex flex-col overflow-hidden">

  <!-- NAVBAR -->
  <header class="flex items-center justify-between bg-gray-900 border-b border-gray-800 px-4 py-2.5">
    <div class="flex items-center gap-4">
      <span class="font-semibold text-base tracking-tight">CodeSync</span>
      <span class="hidden sm:inline text-sm text-gray-500">Room: <span class="text-gray-300 font-mono">ABC123</span></span>
    </div>
    <div class="flex items-center gap-3 text-sm">
      <span class="hidden sm:inline text-gray-500">3 Users</span>
      <button class="bg-gray-800 hover:bg-gray-700 transition-colors px-3 py-1.5 rounded text-sm">Share</button>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <div class="flex flex-1 overflow-hidden">

    <!-- FILE SIDEBAR -->
    <aside class="hidden md:block w-48 bg-gray-900 border-r border-gray-800 p-3 text-sm overflow-y-auto">
      <div class="flex items-center justify-between mb-2">
        <p class="text-gray-500 uppercase text-xs">Files</p>
        <div class="flex gap-1">
          <button id="new-file-btn" title="New File" class="text-gray-400 hover:text-white px-1">＋</button>
          <button id="rename-file-btn" title="Rename File" class="text-gray-400 hover:text-white px-1">✎</button>
          <button id="delete-file-btn" title="Delete File" class="text-gray-400 hover:text-red-400 px-1">🗑</button>
        </div>
      </div>
      <ul id="file-list" class="space-y-1"></ul>
    </aside>

    <!-- EDITOR + OUTPUT -->
    <main class="flex-1 flex flex-col overflow-hidden">
      <div id="editor-container" class="flex-1 bg-gray-900 border-b border-gray-800 relative"></div>

      <div class="h-40 bg-black border-t border-gray-800 flex flex-col">
        <div class="flex items-center justify-between px-3 py-1 border-b border-gray-800 text-sm">
          <span class="text-gray-400">Output</span>
          <button id="run-btn" class="bg-green-700 hover:bg-green-600 transition-colors px-3 py-1 rounded text-xs">Run</button>
        </div>
        <div id="output" class="flex-1 p-3 text-sm text-gray-300 overflow-y-auto font-mono whitespace-pre-wrap"></div>
      </div>
    </main>

    <!-- COLLABORATION PANEL -->
    <aside class="hidden lg:flex w-64 bg-gray-900 border-l border-gray-800 flex-col">
      <div class="p-3 border-b border-gray-800">
        <p class="text-gray-500 uppercase text-xs mb-2">Online</p>
        <ul class="text-sm space-y-1">
          <li>🟢 You</li>
        </ul>
      </div>
      <div class="flex-1 p-3 text-sm text-gray-500">
        Chat placeholder (Phase after MVP)
      </div>
    </aside>

  </div>

  <!-- Monaco Editor loader (AMD-based, loaded from CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

  <script src="js/editor.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/files.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
